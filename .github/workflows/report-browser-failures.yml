name: Report browser test failures

# The Browser tests workflow runs on pull requests, so it keeps a read-only
# token. This workflow reacts to its *result* instead, from the default
# branch, which is where write access is safe to hand out.
on:
  workflow_run:
    workflows: ["Browser tests"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Collect the failing output
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -o pipefail
          gh run view "$RUN_ID" --log-failed > failed.log 2>/dev/null \
            || gh run view "$RUN_ID" --log > failed.log 2>&1 \
            || echo "could not read the log" > failed.log
          wc -l failed.log

      - name: Comment the failure on the commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            // A comment body is capped at 65536 characters, and the tail of a
            // Playwright log is where the failing assertion is reported.
            const limit = 48000
            let log = fs.existsSync("failed.log")
              ? fs.readFileSync("failed.log", "utf8")
              : "no log collected"
            if (log.length > limit) log = "...(trimmed)\n" + log.slice(-limit)
            const body = [
              "Browser tests failed on this commit.",
              "",
              "```",
              log,
              "```",
            ].join("\n")
            const target = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.event.workflow_run.head_sha,
              body,
            }
            try {
              await github.rest.repos.createCommitComment(target)
            } catch (error) {
              core.error(`commit comment failed: ${error}`)
              // a shorter body often clears a size or encoding rejection
              await github.rest.repos.createCommitComment({
                ...target,
                body: body.slice(-20000),
              })
            }