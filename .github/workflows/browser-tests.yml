name: Browser tests

# Separate from the Pages deploy on purpose: the suite renders a full 3D
# studio through a software rasteriser, which takes roughly twenty minutes on
# a hosted runner. It reports on quality, it does not gate the website.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DEPLOY_BASE: /

      - name: Install browser test dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: .browser-cache

      - name: Run browser tests
        run: pnpm test

      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7